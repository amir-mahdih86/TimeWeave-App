[package]
name = "timeweave"
version = "1.0.0"
description = "Smart weekly planner with native reminders and alarms"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Debug Android builds embed huge DWARF sections into libapp_lib.so (~120MB);
# stripping them keeps debug APKs small enough for on-device installs while
# still compiling with debug assertions and no optimizations.
[profile.dev]
strip = "debuginfo"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-notification = "2"


[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
