name: Desktop bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: "--bundles appimage,deb"
          - platform: windows-latest
            args: "--bundles msi,nsis"
          - platform: macos-latest
            args: "--bundles dmg"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust build
        uses: Swatinam/rust-cache@v2
        with:
          workspaces: |
            src-tauri

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # Needed by AppImage tooling on older runners
          sudo apt-get install -y libssl-dev libgtk-3-dev libayatana-appindicator3-dev || true

      - name: Frontend install
        run: npm ci

      - name: Build bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy's bundled strip chokes on .relr.dyn sections — skip stripping
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 1
        with:
          projectPath: .
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "TimeWeave v__VERSION__"
          releaseBody: "Desktop installers: AppImage/Deb (Linux), MSI/NSIS (Windows), DMG (macOS)."
          releaseDraft: true
          args: ${{ matrix.args }}
